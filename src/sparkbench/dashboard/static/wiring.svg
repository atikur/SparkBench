<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 38 640 376" role="img" aria-labelledby="title desc">
<title id="title">Wiring for the supported ESP32 kit</title>
<desc id="desc">GPIO25 through a 330 ohm resistor to the red LED; GPIO26 through a 330 ohm resistor to the green LED; both LED short legs to ESP32 ground. OLED SDA to GPIO21, SCL to GPIO22, VCC to 3.3 V, GND to ground. Logical connections, not physical pin positions.</desc>
<rect y="38" width="640" height="376" fill="#f6f8f7"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#17262a">

  <!-- ESP32 with its pins on the right edge -->
  <rect x="20" y="50" width="150" height="310" rx="8" fill="#e3efeb" stroke="#1f6b66" stroke-width="1.5"/>
  <text x="36" y="76" font-weight="700">ESP32</text>
  <g text-anchor="end">
    <text x="160" y="108">GPIO25</text>
    <text x="160" y="158">GPIO26</text>
    <text x="160" y="208">GND</text>
    <text x="160" y="258">GPIO21</text>
    <text x="160" y="288">GPIO22</text>
    <text x="160" y="318">3.3 V</text>
    <text x="160" y="348">GND</text>
  </g>

  <!-- Red LED: GPIO25 -> resistor -> LED -> ground rail -->
  <path d="M170 104H240M310 104H374" stroke="#b23f3a" stroke-width="2.5" fill="none"/>
  <rect x="240" y="92" width="70" height="24" rx="4" fill="#fff" stroke="#66767a"/>
  <text x="275" y="109" text-anchor="middle">330 Ω</text>
  <circle cx="386" cy="104" r="12" fill="#f6d5d3" stroke="#b23f3a" stroke-width="1.5"/>
  <text x="386" y="134" text-anchor="middle" font-size="12">Red LED</text>
  <path d="M398 104H560" stroke="#3d4a4d" stroke-width="2.5" fill="none"/>

  <!-- Green LED: GPIO26 -> resistor -> LED -> ground rail -->
  <path d="M170 154H240M310 154H374" stroke="#1f6f45" stroke-width="2.5" fill="none"/>
  <rect x="240" y="142" width="70" height="24" rx="4" fill="#fff" stroke="#66767a"/>
  <text x="275" y="159" text-anchor="middle">330 Ω</text>
  <circle cx="386" cy="154" r="12" fill="#d2ecd9" stroke="#1f6f45" stroke-width="1.5"/>
  <text x="386" y="184" text-anchor="middle" font-size="12">Green LED</text>
  <path d="M398 154H560" stroke="#3d4a4d" stroke-width="2.5" fill="none"/>

  <!-- Ground rail back to the ESP32 GND pin -->
  <path d="M560 104V204H170" stroke="#3d4a4d" stroke-width="2.5" fill="none"/>
  <circle cx="560" cy="154" r="3.5" fill="#3d4a4d"/>
  <text x="572" y="158" font-size="12" fill="#66767a">GND</text>

  <!-- OLED -->
  <path d="M170 254H430M170 284H430" stroke="#0a5bd8" stroke-width="2.5" fill="none"/>
  <path d="M170 314H430" stroke="#c46a1a" stroke-width="2.5" fill="none"/>
  <path d="M170 344H430" stroke="#3d4a4d" stroke-width="2.5" fill="none"/>
  <rect x="430" y="236" width="170" height="124" rx="8" fill="#fff" stroke="#1f6b66" stroke-width="1.5"/>
  <text x="444" y="258">SDA</text>
  <text x="444" y="288">SCL</text>
  <text x="444" y="318">VCC</text>
  <text x="444" y="348">GND</text>
  <text x="562" y="302" text-anchor="middle" font-weight="700">OLED</text>

  <text x="20" y="384" font-size="11.5" fill="#66767a">LED long leg (+) faces the resistor; short leg (−) goes to GND.</text>
  <text x="20" y="401" font-size="11.5" fill="#66767a">Wire with USB unplugged. Positions are logical, not physical.</text>
</g>
</svg>
