<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
<title id="title">Known ESP32 kit logical wiring reference</title><desc id="desc">GPIO25 through 330 ohms to the red LED anode; GPIO26 through 330 ohms to the green LED anode. Both cathodes to ground. OLED SDA21, SCL22, VCC3.3V, ground. Positions do not represent physical carrier pin locations.</desc>
<rect width="620" height="300" rx="12" fill="#f4f7f5"/>
<g font-family="Arial,sans-serif" font-size="13" fill="#182a2d">
<text x="20" y="28" font-size="16" font-weight="bold">Known kit · logical connections</text>
<text x="20" y="49" font-size="11" fill="#647375">Locate each printed pin label. This drawing does not show carrier pin positions.</text>
<rect x="20" y="72" width="155" height="195" rx="8" fill="#e1eeea" stroke="#216a68"/>
<text x="38" y="97" font-weight="bold">Classic ESP32</text>
<text x="92" y="124">GPIO25</text><text x="92" y="156">GPIO26</text>
<text x="92" y="188">GPIO21</text><text x="92" y="211">GPIO22</text><text x="114" y="234">3.3 V</text><text x="111" y="257">GND</text>
<path d="M175 120H225M300 120H361M387 120H565V253H175" stroke="#b13f3b" stroke-width="2" fill="none"/>
<path d="M175 152H225M300 152H361M387 152H565" stroke="#236e49" stroke-width="2" fill="none"/>
<rect x="225" y="108" width="75" height="24" rx="4" fill="white" stroke="#647375"/><text x="240" y="125">330 Ω</text>
<rect x="225" y="140" width="75" height="24" rx="4" fill="white" stroke="#647375"/><text x="240" y="157">330 Ω</text>
<circle cx="374" cy="120" r="13" fill="#f6d5d3" stroke="#b13f3b"/><circle cx="374" cy="152" r="13" fill="#d2ecd9" stroke="#236e49"/>
<text x="406" y="124">Red LED</text><text x="406" y="156">Green LED</text><text x="350" y="92" font-size="10">Anode (+) left · cathode (−) right</text>
<rect x="352" y="174" width="170" height="95" rx="7" fill="white" stroke="#216a68"/>
<text x="438" y="196" font-weight="bold">OLED</text>
<path d="M175 184H350M175 207H350M175 230H350M175 253H350" stroke="#216a68" stroke-width="2"/>
<text x="366" y="188">SDA</text><text x="366" y="211">SCL</text><text x="366" y="234">VCC</text><text x="366" y="257">GND</text>
<text x="20" y="288" font-size="10" fill="#647375">Power disconnected while wiring. Servo stays off and untouched. Confirm exact module labels.</text>
