<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#5b6770;stroke-width:1.5;rx:8}
      .meta{fill:#eef6f3;stroke:#2f7d6b;stroke-width:1.5}
      .hw{fill:#fff7ea;stroke:#b7791f;stroke-width:1.5}
      .trust{fill:#f3f4f6;stroke:#5b6770;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1f2933}
      .m{fill:#5b6770;font-size:12px}
      .h{fill:#1f2933;font-weight:600}
      .lane{fill:#5b6770;font-size:11px;letter-spacing:1.5px;font-weight:600}
      .arrow{stroke:#5b6770;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Lanes -->
  <text x="20" y="28" class="lane">PERSON + LOCAL DASHBOARD</text>
  <text x="20" y="178" class="lane">META MODEL API (MUSE SPARK 1.3 CONTRIBUTOR)</text>
  <text x="20" y="318" class="lane">TRUSTED LOCAL CODE + PHYSICAL BENCH</text>

  <!-- Row 1: user flow -->
  <rect x="20" y="40" width="170" height="92" class="box" rx="8"/>
  <text x="105" y="66" text-anchor="middle" class="h">1. Describe</text>
  <text x="105" y="86" text-anchor="middle" class="m">idea, parts on hand,</text>
  <text x="105" y="102" text-anchor="middle" class="m">progress photos</text>

  <rect x="230" y="40" width="170" height="92" class="box" rx="8"/>
  <text x="315" y="66" text-anchor="middle" class="h">2. Review plan</text>
  <text x="315" y="86" text-anchor="middle" class="m">step table: red / green /</text>
  <text x="315" y="102" text-anchor="middle" class="m">OLED label, 3 s each</text>

  <rect x="440" y="40" width="170" height="92" class="box" rx="8"/>
  <text x="525" y="66" text-anchor="middle" class="h">3. Compile + install</text>
  <text x="525" y="86" text-anchor="middle" class="m">explicit actions, app-only</text>
  <text x="525" y="102" text-anchor="middle" class="m">flash, previous image kept</text>

  <rect x="650" y="40" width="170" height="92" class="box" rx="8"/>
  <text x="735" y="66" text-anchor="middle" class="h">4. Camera test</text>
  <text x="735" y="86" text-anchor="middle" class="m">iPhone records the bench</text>
  <text x="735" y="102" text-anchor="middle" class="m">while the firmware runs</text>

  <rect x="860" y="40" width="120" height="92" class="box" rx="8"/>
  <text x="920" y="66" text-anchor="middle" class="h">5. Verdict</text>
  <text x="920" y="86" text-anchor="middle" class="m">pass / mismatch /</text>
  <text x="920" y="102" text-anchor="middle" class="m">incomplete</text>

  <path d="M190,86 L230,86" class="arrow"/>
  <path d="M400,86 L440,86" class="arrow"/>
  <path d="M610,86 L650,86" class="arrow"/>
  <path d="M820,86 L860,86" class="arrow"/>

  <!-- Row 2: Meta roles -->
  <rect x="20" y="190" width="300" height="92" class="meta" rx="8"/>
  <text x="170" y="214" text-anchor="middle" class="h">Build guide (text + up to 3 photos)</text>
  <text x="170" y="236" text-anchor="middle" class="m">clarifies the idea, picks parts from a fixed catalog,</text>
  <text x="170" y="252" text-anchor="middle" class="m">describes what is visible and what is uncertain</text>
  <text x="170" y="270" text-anchor="middle" class="m">→ strict JSON, advisory only</text>

  <rect x="350" y="190" width="300" height="92" class="meta" rx="8"/>
  <text x="500" y="214" text-anchor="middle" class="h">Intent planner (text)</text>
  <text x="500" y="236" text-anchor="middle" class="m">turns a rule like "count 0–3, green for even"</text>
  <text x="500" y="252" text-anchor="middle" class="m">into ≤ 8 steps, or asks one question, or declines</text>
  <text x="500" y="270" text-anchor="middle" class="m">→ strict JSON, never receives the test oracle</text>

  <rect x="680" y="190" width="300" height="92" class="meta" rx="8"/>
  <text x="830" y="214" text-anchor="middle" class="h">OLED reader (vision)</text>
  <text x="830" y="236" text-anchor="middle" class="m">transcribes each cropped OLED frame</text>
  <text x="830" y="252" text-anchor="middle" class="m">without being told the expected label</text>
  <text x="830" y="270" text-anchor="middle" class="m">→ {readable, text}; unknown stays unknown</text>

  <path d="M105,132 L105,190" class="arrow"/>
  <path d="M315,132 L315,160 L500,160 L500,190" class="arrow"/>
  <path d="M735,132 L735,160 L830,160 L830,190" class="arrow"/>

  <!-- Row 3: trusted code and hardware -->
  <rect x="20" y="330" width="235" height="92" class="trust" rx="8"/>
  <text x="137" y="354" text-anchor="middle" class="h">Validator + renderer</text>
  <text x="137" y="376" text-anchor="middle" class="m">schema, pin allowlist, step limits;</text>
  <text x="137" y="392" text-anchor="middle" class="m">plan → C++ data table, no model C++</text>

  <rect x="280" y="330" width="205" height="92" class="trust" rx="8"/>
  <text x="382" y="354" text-anchor="middle" class="h">PlatformIO + esptool</text>
  <text x="382" y="376" text-anchor="middle" class="m">pinned toolchain, hashed binary,</text>
  <text x="382" y="392" text-anchor="middle" class="m">verified flash, ID-only UART check</text>

  <rect x="510" y="330" width="210" height="92" class="hw" rx="8"/>
  <text x="615" y="354" text-anchor="middle" class="h">ESP32 bench</text>
  <text x="615" y="376" text-anchor="middle" class="m">red LED GPIO25 · green LED GPIO26</text>
  <text x="615" y="392" text-anchor="middle" class="m">SH1106 OLED on I²C 21/22</text>

  <rect x="745" y="330" width="235" height="92" class="trust" rx="8"/>
  <text x="862" y="354" text-anchor="middle" class="h">Independent verifier</text>
  <text x="862" y="376" text-anchor="middle" class="m">deterministic LED pixel measurement</text>
  <text x="862" y="392" text-anchor="middle" class="m">+ Meta OLED reading vs frozen steps</text>

  <path d="M500,282 L500,306 L137,306 L137,330" class="arrow"/>
  <path d="M255,376 L280,376" class="arrow"/>
  <path d="M485,376 L510,376" class="arrow"/>
  <path d="M720,376 L745,376" class="arrow"/>
  <path d="M830,282 L830,330" class="arrow"/>
  <path d="M920,330 L920,132" class="arrow"/>
</svg>
