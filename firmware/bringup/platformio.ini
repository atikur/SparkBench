[platformio]
default_envs = classic-uart

[env]
platform = platformio/espressif32@8.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:s3-native-usb]
; Generic S3 build profile, not an identification of the carrier board.
; Flash size and native USB were confirmed using esptool on the connected board.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
; Bring-up does not use PSRAM. Enable it after the board variant is confirmed.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:classic-uart]
; ESP32-D0WD-V3, 4 MB flash, CP2102 UART bridge identified on October 29, 2026.
; This profile uses a USB-to-UART bridge, not the S3's native USB configuration.
board = esp32dev
board_upload.flash_size = 4MB
; First board's 460800-baud read was noisy; use the proven connection speed.
upload_speed = 115200

